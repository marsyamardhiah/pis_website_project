<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 200" width="470" height="200">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D6E8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E6CB0"/>
      <stop offset="1" stop-color="#0E2540"/>
    </linearGradient>
    <radialGradient id="beam" cx="0.1" cy="0.5" r="0.9">
      <stop offset="0" stop-color="#FFE08A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFB300" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shape">
      <path d="M26 82 Q26 48 62 48 L262 48 Q338 50 382 112 L388 134 Q388 146 374 146 L48 146 Q26 146 26 124 Z"/>
    </clipPath>
  </defs>

  <!-- glow in front of the train -->
  <ellipse cx="414" cy="118" rx="52" ry="30" fill="url(#beam)"/>

  <!-- speed lines -->
  <g stroke="#FFFFFF" stroke-linecap="round" opacity="0.55">
    <line x1="2" y1="74" x2="40" y2="74" stroke-width="4"/>
    <line x1="10" y1="96" x2="46" y2="96" stroke-width="3"/>
    <line x1="0" y1="118" x2="34" y2="118" stroke-width="4"/>
    <line x1="14" y1="136" x2="40" y2="136" stroke-width="2.5"/>
  </g>

  <!-- pantograph -->
  <g stroke="#FFB300" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M120 48 L146 24 L172 48"/>
    <line x1="132" y1="24" x2="160" y2="24"/>
  </g>

  <!-- body -->
  <path d="M26 82 Q26 48 62 48 L262 48 Q338 50 382 112 L388 134 Q388 146 374 146 L48 146 Q26 146 26 124 Z" fill="url(#body)"/>
  <g clip-path="url(#shape)">
    <!-- livery -->
    <rect x="20" y="114" width="380" height="10" fill="#FFB300"/>
    <rect x="20" y="126" width="380" height="22" fill="#10273F"/>
    <!-- windows -->
    <rect x="46" y="62" width="202" height="38" rx="10" fill="url(#glass)"/>
    <g fill="#FFFFFF" opacity="0.28">
      <rect x="58" y="68" width="34" height="26" rx="5"/>
      <rect x="102" y="68" width="34" height="26" rx="5"/>
      <rect x="146" y="68" width="34" height="26" rx="5"/>
      <rect x="190" y="68" width="34" height="26" rx="5"/>
    </g>
    <!-- windscreen -->
    <path d="M262 60 Q322 64 362 112 L262 112 Z" fill="url(#glass)"/>
    <path d="M276 70 Q316 76 342 100 L276 100 Z" fill="#FFFFFF" opacity="0.2"/>
    <!-- doors -->
    <rect x="94" y="104" width="2.5" height="42" fill="#8FA5C0"/>
    <rect x="228" y="104" width="2.5" height="42" fill="#8FA5C0"/>
  </g>

  <!-- headlight -->
  <circle cx="380" cy="118" r="6" fill="#FFB300"/>
  <circle cx="380" cy="118" r="3" fill="#FFFFFF"/>

  <!-- wheels / bogies -->
  <g fill="#0B1D31">
    <rect x="70" y="140" width="64" height="12" rx="6"/>
    <rect x="270" y="140" width="64" height="12" rx="6"/>
  </g>
  <g fill="#4B5B72" stroke="#0B1D31" stroke-width="3">
    <circle cx="86" cy="156" r="9"/><circle cx="118" cy="156" r="9"/>
    <circle cx="286" cy="156" r="9"/><circle cx="318" cy="156" r="9"/>
  </g>

  <!-- track -->
  <rect x="0" y="168" width="420" height="5" rx="2.5" fill="#8FA5C0"/>
  <g fill="#6E83A1">
    <rect x="14" y="174" width="18" height="8" rx="2"/><rect x="62" y="174" width="18" height="8" rx="2"/>
    <rect x="110" y="174" width="18" height="8" rx="2"/><rect x="158" y="174" width="18" height="8" rx="2"/>
    <rect x="206" y="174" width="18" height="8" rx="2"/><rect x="254" y="174" width="18" height="8" rx="2"/>
    <rect x="302" y="174" width="18" height="8" rx="2"/><rect x="350" y="174" width="18" height="8" rx="2"/>
    <rect x="398" y="174" width="18" height="8" rx="2"/>
  </g>
</svg>
